<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="486" viewBox="0 0 700 243" role="img" aria-labelledby="title desc">
<title id="title">jalLijiye: bottle detector benchmarks (Apple M1 MacBook Air)</title>
<desc id="desc">Three benchmark charts compare inference time and memory for PyTorch MPS and FP16 Core ML, then compare person and bottle model profiles on MPS.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f6fa}.head{font-size:10px;font-weight:600}.sub{font-size:8px}.legend{font-size:6px;fill:#d5dbe3}.tick{font-size:7px;fill:#d2d7df}.val{font-size:7px;font-weight:600}.cat{font-size:7px}.grid{stroke:#69717b;stroke-width:.6}.axis{stroke:#aab1bb;stroke-width:.7}</style></defs>
<rect width="700" height="243" fill="#0d1218"/>
<text x="350" y="13" text-anchor="middle" class="head">jalLijiye: bottle detector benchmarks (Apple M1 MacBook Air)</text>
